<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nosso Caixa</title>
<meta name="description" content="Controle financeiro de casal: entradas, gastos, faturas de cartão, parcelas e projeção de 12 meses.">
<meta name="theme-color" content="#0E6E7B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nosso Caixa">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>
<style id="appcss">
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F5F9F8; --surface-3:#E7EEEC;
  --line:#D9E3E1; --line-forte:#BFCECB;
  --ink:#10201E; --ink-2:#4A5F5C; --ink-3:#7E908D;
  --accent:#0E6E7B; --accent-ink:#FFFFFF; --accent-soft:#DBECEE; --accent-2:#63AEB7;
  --pos:#1F7A4D; --pos-soft:#DDEFE4;
  --neg:#B24A32; --neg-soft:#F6E3DD;
  --warn:#96690F; --warn-soft:#F4E9D2;
  --sombra:0 1px 2px rgba(16,32,30,.05), 0 8px 24px -16px rgba(16,32,30,.28);
  --r:14px; --r-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1312; --surface:#131E1D; --surface-2:#182524; --surface-3:#1F2E2C;
    --line:#263634; --line-forte:#3A4E4B;
    --ink:#E4EDEB; --ink-2:#A2B5B2; --ink-3:#748885;
    --accent:#48B4BF; --accent-ink:#04201F; --accent-soft:#15302F; --accent-2:#27757F;
    --pos:#57C08A; --pos-soft:#142E23;
    --neg:#E5836A; --neg-soft:#33201B;
    --warn:#D9A83F; --warn-soft:#2E2716;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1312; --surface:#131E1D; --surface-2:#182524; --surface-3:#1F2E2C;
  --line:#263634; --line-forte:#3A4E4B;
  --ink:#E4EDEB; --ink-2:#A2B5B2; --ink-3:#748885;
  --accent:#48B4BF; --accent-ink:#04201F; --accent-soft:#15302F; --accent-2:#27757F;
  --pos:#57C08A; --pos-soft:#142E23;
  --neg:#E5836A; --neg-soft:#33201B;
  --warn:#D9A83F; --warn-soft:#2E2716;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Archivo','Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.015em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.rot{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}

/* ---------- chrome ---------- */
.topo{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topo-in{max-width:1080px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:relative}
.marca{display:flex;align-items:center;gap:9px;margin-right:auto;font-weight:700;letter-spacing:-.02em;font-size:16px}
.marca svg{display:block}
.status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);font-family:'IBM Plex Mono',monospace}
.ponto{width:7px;height:7px;border-radius:50%;background:var(--pos)}
.ponto.ocupado{background:var(--warn);animation:pulsa 1s infinite}
.ponto.frio{background:var(--ink-3)}
.ponto.ruim{background:var(--neg)}
@keyframes pulsa{50%{opacity:.25}}

.datanav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px}
.datanav button{background:none;border:0;cursor:pointer;color:var(--ink-2);padding:5px 10px;border-radius:99px;line-height:1}
.datanav button:hover{background:var(--surface-3);color:var(--ink)}
.datanav .rotulo{min-width:126px;text-align:center;font-weight:600;font-size:14px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.datanav .rotulo::after{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--ink-3)}
.datanav .rotulo[aria-expanded="true"]::after{transform:rotate(180deg)}
.picker{position:absolute;top:calc(100% + 9px);left:0;z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px -18px rgba(0,0,0,.45);padding:13px;width:min(312px,calc(100vw - 32px))}
.picker-ano{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.picker-ano span{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px;letter-spacing:.02em}
.picker-ano button{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--ink-2);line-height:1}
.picker-ano button:hover{background:var(--surface-3);color:var(--ink)}
.picker-meses{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.picker-meses button{position:relative;padding:10px 0 12px;border-radius:9px;border:1px solid transparent;background:var(--surface-2);color:var(--ink-2);font-size:13px;cursor:pointer}
.picker-meses button:hover{background:var(--surface-3);color:var(--ink)}
.picker-meses button.agora{border-color:var(--line-forte);color:var(--ink)}
.picker-meses button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600;border-color:var(--accent)}
.picker-meses button i{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
.picker-meses button[aria-current="true"] i{background:var(--accent-ink)}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg button{background:none;border:0;cursor:pointer;padding:5px 11px;border-radius:99px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

.abas{max-width:1080px;margin:0 auto;padding:8px 16px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{background:none;border:0;cursor:pointer;padding:8px 12px 11px;color:var(--ink-2);font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;font-weight:500}
.abas button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

main{max-width:1080px;margin:0 auto;padding:18px 16px 110px}
.vista{display:none;flex-direction:column;gap:14px}
.vista.ativa{display:flex}

/* ---------- cartões ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sombra)}
.card-cab{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-cab h2{font-size:15px;margin-right:auto}
.card-corpo{padding:16px}
.grade{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.grade-resumo{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.grade-resumo > :first-child{grid-column:1/-1}
.grade-resumo .menor .valor{font-size:clamp(19px,5vw,24px)}
@media (min-width:760px){.grade-resumo{grid-template-columns:1.4fr 1fr 1fr}.grade-resumo > :first-child{grid-column:auto}}

.saldo{padding:18px 16px}
.saldo .valor{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:clamp(28px,7vw,38px);font-weight:600;letter-spacing:-.03em;line-height:1.05;margin-top:6px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .wrn{color:var(--warn)}
.linha-kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.linha-kv:last-child{border-bottom:0}
.linha-kv .v{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}

.pilula{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pilula.a{background:var(--accent-soft);color:var(--accent)}
.pilula.b{background:var(--neg-soft);color:var(--neg)}
.pilula.n{background:var(--pos-soft);color:var(--pos)}
.pilula.alerta{background:var(--warn-soft);color:var(--warn)}

.barra{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.barra > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.barra > i.wrn{background:var(--warn)} .barra > i.neg{background:var(--neg)} .barra > i.pos{background:var(--pos)}

/* trilho das parcelas */
.trilho{display:flex;gap:5px;align-items:flex-end;overflow-x:auto;padding:4px 0 0;scrollbar-width:thin}
.trilho .m{flex:1 0 46px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;background:none;border:0;padding:0}
.trilho .col{width:100%;height:96px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.trilho .m[data-atual="1"] .col{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.trilho .fat{background:var(--accent);width:100%}
.trilho .fin{background:var(--accent-2);width:100%}
.trilho .fix{background:var(--ink-3);width:100%;opacity:.5}
.trilho .rot-m{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.trilho .m[data-atual="1"] .rot-m{color:var(--accent);font-weight:600}
.trilho .val{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-2)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.legenda span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
.legenda i{width:10px;height:10px;border-radius:3px;display:block}

/* listas */
.lista{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .desc{flex:1;min-width:0}
.item .desc b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .desc small{color:var(--ink-3);font-size:12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.item .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.icone{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);flex:none;font-size:15px}
.vazio{padding:30px 18px;text-align:center;color:var(--ink-3);font-size:14px}
.vazio b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

/* formulários */
.campo{display:flex;flex-direction:column;gap:5px}
.campo > label{font-size:12px;color:var(--ink-2);font-weight:500}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.linha-campos{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.check input{width:auto}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r-sm);padding:11px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{filter:brightness(1.08)}
.btn.fantasma{background:transparent;color:var(--ink-2);border:1px solid var(--line-forte)}
.btn.fantasma:hover{background:var(--surface-3);color:var(--ink)}
.btn.perigo{background:transparent;color:var(--neg);border:1px solid var(--neg)}
.btn.mini{padding:6px 11px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.acoes{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}

.rapido{display:flex;gap:8px;align-items:stretch}
.rapido input{flex:1}
.im-tab td{padding:7px 9px;vertical-align:middle}
.im-tab th{padding:8px 9px}
.im-tab input[type="text"]{padding:6px 8px;font-size:13px;min-width:150px}
.im-tab select{padding:6px 8px;font-size:12.5px;min-width:118px}
.im-tab input[type="checkbox"]{width:17px;height:17px}
.im-tab tr.fora{opacity:.42}
.im-tab .p{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);font-weight:600}
.ajuda-tipo{margin:0 0 14px;font-size:13px;color:var(--ink-2);line-height:1.55;padding:10px 12px;background:var(--surface-2);border-radius:9px;border-left:3px solid var(--accent)}
.dica-parse{font-size:12.5px;color:var(--ink-3);margin-top:8px;line-height:1.55}
.dica-parse code{background:var(--surface-3);padding:1.5px 5px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-2)}

/* análise */
.insight{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}
.insight .faixa{width:3px;border-radius:99px;flex:none;background:var(--ink-3)}
.insight.bom .faixa{background:var(--pos)}
.insight.atencao .faixa{background:var(--warn)}
.insight.critico .faixa{background:var(--neg)}
.insight h3{font-size:14.5px;margin-bottom:3px}
.insight p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.insight p b{color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:600}
.destaque{padding:20px 18px;background:linear-gradient(180deg,var(--accent-soft),transparent);border-radius:var(--r) var(--r) 0 0}
.destaque .grande{font-size:clamp(22px,5.5vw,30px);font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:4px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
.rolagem{overflow-x:auto}
th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;text-align:right}
tbody tr:hover{background:var(--surface-2)}

/* diversos */
.fab{position:fixed;right:18px;bottom:22px;z-index:25;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-size:26px;line-height:1;cursor:pointer;box-shadow:0 6px 20px -6px rgba(14,110,123,.7)}
.aviso{padding:12px 14px;border-radius:var(--r-sm);font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
.aviso.info{background:var(--accent-soft);color:var(--accent)}
.aviso.alerta{background:var(--warn-soft);color:var(--warn)}
.torrada{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:60;background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:99px;font-size:13.5px;box-shadow:var(--sombra);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.torrada.ver{opacity:1;transform:translateX(-50%) translateY(-4px)}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:0;max-width:min(430px,92vw);width:100%;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(6,18,17,.55);backdrop-filter:blur(2px)}
.modal-cab{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.modal-cab h2{font-size:17px;margin-top:2px}
.modal-cab .dl-total{margin-left:auto;font-weight:600;font-size:17px;white-space:nowrap;align-self:center;font-variant-numeric:tabular-nums}
.dl-corpo{max-height:min(62vh,520px);overflow-y:auto}
#dlg-lista{max-width:min(560px,94vw)}
#dlg-editar{max-width:min(560px,94vw)}
.clicavel{cursor:pointer;position:relative}
.clicavel:hover{border-color:var(--line-forte)}
.clicavel::after{content:"›";position:absolute;right:14px;top:14px;color:var(--ink-3);font-size:17px;line-height:1}
.item.clicavel::after{top:50%;transform:translateY(-50%)}
.item.clicavel{padding-right:30px}
.modal-corpo{padding:20px}
.modal-corpo h2{font-size:17px;margin-bottom:5px}
.modal-corpo p{color:var(--ink-2);font-size:13.5px;margin:0 0 14px}
.oculto{display:none!important}
</style>

<template id="shell">
<header class="topo">
  <div class="topo-in">
    <div class="marca">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="9" cy="12" r="6.2" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="15" cy="12" r="6.2" stroke="currentColor" stroke-width="1.7" opacity=".55"/>
      </svg>
      Nosso Caixa
    </div>
    <div class="status" id="status"><span class="ponto frio" id="ponto"></span><span id="status-txt">carregando</span></div>
    <div class="seg" id="seg-ver"></div>
  </div>
  <div class="topo-in" style="padding-top:8px">
    <div class="datanav">
      <button type="button" id="mes-ant" aria-label="Mês anterior">‹</button>
      <button type="button" class="rotulo mono" id="mes-abre" aria-expanded="false" aria-haspopup="true">—</button>
      <button type="button" id="mes-prox" aria-label="Próximo mês">›</button>
    </div>
    <button type="button" class="btn fantasma mini" id="btn-hoje">Hoje</button>
    <div class="picker oculto" id="picker">
      <div class="picker-ano">
        <button type="button" id="ano-ant" aria-label="Ano anterior">‹</button>
        <span id="ano-rot">—</span>
        <button type="button" id="ano-prox" aria-label="Próximo ano">›</button>
      </div>
      <div class="picker-meses" id="picker-meses"></div>
    </div>
  </div>
  <nav class="abas" id="abas" role="tablist"></nav>
</header>

<main>
  <!-- PAINEL -->
  <section class="vista" id="v-painel">
    <div class="grade-resumo">
      <div class="card saldo">
        <span class="rot">Sobra do mês</span>
        <div class="valor" id="p-saldo">—</div>
        <div class="barra"><i id="p-barra" style="width:0"></i></div>
        <div class="rot" style="margin-top:8px" id="p-saldo-sub"></div>
      </div>
      <div class="card saldo menor clicavel" id="card-entrou" role="button" tabindex="0">
        <span class="rot">Entrou</span>
        <div class="valor pos" id="p-entrou">—</div>
        <div class="rot" style="margin-top:8px" id="p-entrou-sub"></div>
      </div>
      <div class="card saldo menor clicavel" id="card-saiu" role="button" tabindex="0">
        <span class="rot">Saiu</span>
        <div class="valor neg" id="p-saiu">—</div>
        <div class="rot" style="margin-top:8px" id="p-saiu-sub"></div>
      </div>
      <div class="card saldo menor oculto clicavel" id="card-dela" role="button" tabindex="0">
        <span class="rot" id="p-dela-rot">Gastos dela</span>
        <div class="valor" id="p-dela">—</div>
        <div class="rot" style="margin-top:8px" id="p-dela-sub"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-cab"><h2>Faturas a pagar neste mês</h2><span class="rot" id="p-fat-total"></span></div>

<script id="appjs">
(function(){
"use strict";

/* ===================== estado ===================== */
const PADRAO = {
  v:2, updatedAt:0,
  config:{nomeEla:"Noiva", faturaNoVencimento:true,
    cats:["Mercado","Casa","Filho","Pensão","Escola","Carro","Gasolina","Saúde","Impostos","Restaurante","Lazer","Roupas","Assinaturas","Beleza","Casamento","Pets","Outros"],
    catsEnt:["Salário","Pró-labore","Dividendos","Freela","Reembolso","Outros"]},
  cartoes:[], lancamentos:[], compras:[]
};
const CHAVE_LOCAL = "nossocaixa:v1";
let S = null;
let api = null;             // namespace do artifact
let modo = "local";         // local | nuvem | leitura
let salvando = false, pendente = false, timerSalvar = null, nuvemFalhou = false;

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function normaliza(e){
  const s = Object.assign(clone(PADRAO), e||{});
  s.config = Object.assign(clone(PADRAO.config), (e&&e.config)||{});
  s.cartoes = Array.isArray(s.cartoes)?s.cartoes:[];
  s.lancamentos = Array.isArray(s.lancamentos)?s.lancamentos:[];
  s.compras = Array.isArray(s.compras)?s.compras:[];
  // migração da versão de perfis (A/B/N) para a etiqueta "dela"
  if(e && e.config && !e.config.nomeEla && e.config.nomeB) s.config.nomeEla = e.config.nomeB;
  const migra = r => { if(r && r.dela===undefined){ r.dela = (r.perfil === "B"); delete r.perfil; } return r; };
  s.lancamentos.forEach(migra); s.compras.forEach(migra);
  s.cartoes.forEach(c=>{ if(c && "titular" in c) delete c.titular; });
  ["Pensão","Escola","Impostos"].forEach(c=>{ if(s.config.cats.indexOf(c)<0) s.config.cats.push(c); });
  s.v = 2;
  return s;
}
function lerEmbutido(){
  try{ return normaliza(JSON.parse(document.getElementById("estado").textContent)); }
  catch(_){ return clone(PADRAO); }
}
function lerLocal(){
  try{ const t = localStorage.getItem(CHAVE_LOCAL); return t?normaliza(JSON.parse(t)):null; }
  catch(_){ return null; }
}
function gravarLocal(){
  try{ localStorage.setItem(CHAVE_LOCAL, JSON.stringify(S)); }catch(_){}

const MESES_CURTO = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const brl = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});

function compSoma(c,n){
  const [a,m] = c.split("-").map(Number);
  const t = a*12 + (m-1) + n;
  return Math.floor(t/12)+"-"+String((t%12)+1).padStart(2,"0");
}
function compDelta(a,b){
  const [aa,am]=a.split("-").map(Number), [ba,bm]=b.split("-").map(Number);
  return (ba-aa)*12+(bm-am);
}
function compRotulo(c,curto){
  const [a,m]=c.split("-").map(Number);
  return (curto?MESES_CURTO[m-1]:MESES[m-1])+(curto?"/"+String(a).slice(2):" de "+a);
}
function cap(s){ s=String(s||""); return s.charAt(0).toUpperCase()+s.slice(1); }
function num(t){
  if(typeof t === "number") return t;
  let s = String(t||"").trim().replace(/[^\d.,-]/g,"");
  if(s.indexOf(",")>-1) s = s.replace(/\./g,"").replace(",",".");
  const v = parseFloat(s);
  return isFinite(v)?v:0;
}

/* ===================== regras de negócio ===================== */
function valorParcela(c,n){
  const base = Math.round((c.valorTotal/c.parcelas)*100)/100;
  if(n < c.parcelas) return base;
  return Math.round((c.valorTotal - base*(c.parcelas-1))*100)/100;
}
function deslocCartao(cartaoId){
  if(S.config.faturaNoVencimento === false) return 0;
  const c = S.cartoes.find(x=>x.id===cartaoId);
  if(!c) return 1;
  return (Number(c.vencimento)||10) <= (Number(c.fechamento)||28) ? 1 : 0;
}
function deslocDe(compra){ return compra.fin ? 0 : deslocCartao(compra.cartao); }
// parcelas que SAEM da conta no mês (regime de caixa)
function parcelasPagasEm(comp, filtro){
  const out=[];
  for(const c of S.compras){
    if(filtro && !filtro(c.dela)) continue;
    const faturaDe = compSoma(comp, -deslocDe(c));
    const k = compDelta(c.compInicio, faturaDe);
    if(k>=0 && k<c.parcelas) out.push({compra:c, n:k+1, valor:valorParcela(c,k+1), faturaDe});
  }
  return out;
}
// parcelas que ENTRAM na fatura que fecha no mês (regime de competência)
function parcelasDe(comp, filtro){
  const out=[];
  for(const c of S.compras){
    if(filtro && !filtro(c.dela)) continue;
    const k = compDelta(c.compInicio, comp);
    if(k>=0 && k<c.parcelas) out.push({compra:c, n:k+1, valor:valorParcela(c,k+1)});
  }
  return out;
}
function totalParcelas(comp, filtro){
  return parcelasDe(comp, filtro).reduce((s,p)=>s+p.valor,0);
}
function totalCartao(comp, filtro){
  return parcelasPagasEm(comp, filtro).filter(p=>!p.compra.fin).reduce((s,p)=>s+p.valor,0);
}
function totalFin(comp, filtro){
  return parcelasPagasEm(comp, filtro).filter(p=>p.compra.fin).reduce((s,p)=>s+p.valor,0);
}
function fechandoCartao(comp, filtro){
  return parcelasDe(comp, filtro).filter(p=>!p.compra.fin).reduce((s,p)=>s+p.valor,0);
}
function faturaCartao(cartaoId, comp, filtro){
  return parcelasPagasEm(comp, filtro).filter(p=>p.compra.cartao===cartaoId).reduce((s,p)=>s+p.valor,0);
}
function faturaFechando(cartaoId, comp, filtro){
  return parcelasDe(comp, filtro).filter(p=>p.compra.cartao===cartaoId).reduce((s,p)=>s+p.valor,0);
}
function ativoNoMes(l, comp){
  if(l.fixo) return l.comp <= comp;
  return l.comp === comp;
}
function fluxo(comp, filtro){
  let ent=0, gas=0, fixos=0;
  for(const l of S.lancamentos){
    if(filtro && !filtro(l.dela)) continue;
    if(!ativoNoMes(l,comp)) continue;
    if(l.tipo==="entrada") ent += l.valor;
    else { gas += l.valor; if(l.fixo) fixos += l.valor; }
  }
  const fat = totalCartao(comp, filtro), fin = totalFin(comp, filtro);
  return {ent, gas, fat, fin, fixos, saida:gas+fat+fin, saldo: ent-gas-fat-fin};
}
function ultimaComp(so){
  let u = null;
  for(const c of S.compras){
    if(so==="cartao" && c.fin) continue;
    if(so==="fin" && !c.fin) continue;
    const f = compSoma(c.compInicio, c.parcelas-1+deslocDe(c));
    if(!u || f>u) u = f;
  }
  return u;
}
function dividaFutura(comp, filtro){
  let t = 0;
  for(const c of S.compras){
    if(filtro && !filtro(c.dela)) continue;
    const d = deslocDe(c);
    for(let n=1;n<=c.parcelas;n++){
      if(compSoma(c.compInicio,n-1+d) >= comp) t += valorParcela(c,n);
    }
  }
  return t;
}
function primeiraComp(dataISO, cartao){
  const d = Number(String(dataISO).slice(8,10));
  const c = compDe(dataISO);
  const fecha = cartao ? Number(cartao.fechamento||28) : 28;
  return d < fecha ? c : compSoma(c,1);
}

async function salvar(){
  if(!api || modo==="leitura") { marcarStatus(); return; }
  if(salvando){ pendente = true; return; }
  salvando = true; marcarStatus();
  const corpo = JSON.stringify(S);
  try{
    await api.publish({"dados/estado.json": corpo});
    modo = "nuvem"; nuvemFalhou = false;
  }catch(e){
    const c = e && e.code;
    if(c==="conflict"){ torrada("Alguém salvou antes — recarregando com a versão mais nova."); }
    else if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"){ modo="leitura"; torrada("Este acesso é só de leitura."); }
    else if(c==="rate_limited"){ pendente = true; setTimeout(()=>{ salvando=false; salvar(); }, 12000); }
    else if(c==="capability_disabled"||c==="capability_removed"||c==="read_only_path"||c==="transform_error"||c==="invalid_content"){
      try{
        sessionStorage.setItem("nc:volta", JSON.stringify({aba,mes,ver}));
        await api.publish(docCompleto(S));
        modo = "nuvem"; nuvemFalhou = false;
      }catch(e2){
        if(e2 && e2.code==="conflict"){ torrada("Alguém salvou antes — recarregando."); }
        else { modo="local"; nuvemFalhou=true; torrada("Não deu para salvar na nuvem; guardei neste aparelho."); }
      }
    }
    else { modo="local"; nuvemFalhou=true; torrada("Não deu para salvar na nuvem; guardei neste aparelho."); }
  }
  salvando = false; marcarStatus();
  if(pendente){ pendente=false; setTimeout(salvar, 400); }
}

  let x = String(t).trim().replace(/[R$\s]/gi,"").replace(/^\+/,"");

  let m = txt.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+"-"+m[2]+"-"+m[3];
  m = txt.match(/(\d{8})(?!\d)/);
  if(m && Number(m[1].slice(0,4))>1990) return m[1].slice(0,4)+"-"+m[1].slice(4,6)+"-"+m[1].slice(6,8);
  m = txt.match(/(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?/);
  if(m){
    let a = m[3] ? Number(m[3]) : ano0;
    if(a < 100) a += 2000;
    const mm = Number(m[2]), dd = Number(m[1]);
    if(mm>=1 && mm<=12 && dd>=1 && dd<=31){

function lerOfx(txt){
  const out = [];
  const blocos = txt.split(/<STMTTRN>/i).slice(1);
  for(const b of blocos){
    const pega = tag => { const m = b.match(new RegExp("<"+tag+">([^<\r\n]*)","i")); return m ? m[1].trim() : ""; };
    const val = moeda(pega("TRNAMT"));
    const desc = (pega("MEMO") || pega("NAME") || "").trim();
    const dt = pega("DTPOSTED").slice(0,8);
    if(!isFinite(val) || !desc) continue;
    out.push({bruto: desc, data: dt.length===8 ? dt.slice(0,4)+"-"+dt.slice(4,6)+"-"+dt.slice(6,8) : null, valor: val, credito: val>0});
  }
  return out;
}
function fatiar(linha){
  if(linha.indexOf(";")>-1) return linha.split(";");
  if(linha.indexOf("\t")>-1) return linha.split("\t");
  const virgulas = (linha.match(/,/g)||[]).length;
  if(virgulas>=2 && !/\d,\d{2}(\D|$)/.test(linha)) return linha.split(",");
  return null;
}
function soValor(l){
  return /^[-+(]?\s*R?\$?\s*\d{1,3}(?:\.\d{3})*(?:,\d{2})?\)?$/.test(l) || /^[-+(]?\s*R?\$?\s*\d+[.,]\d{2}\)?$/.test(l);
}
function lerBlocos(texto, compRef){
  const out = [];
  let desc = [], data = null;
  for(const cru of texto.split(/\r?\n/)){
    const linha = cru.trim();
    if(!linha) continue;
    if(soValor(linha)){
      const valor = moeda(linha);
      const txt = desc.join(" ").replace(/\s{2,}/g," ").trim();
      if(isFinite(valor) && valor!==0 && txt) out.push(montarLinha(txt, valor, data, compRef));
      desc = []; data = null;
      continue;
    }
    if(pareceData(linha)){ data = acharData(linha, compRef) || data; continue; }
    desc.push(linha);
    if(desc.length > 4) desc.shift();
  }
  return out;
}
function lerExtrato(texto, compRef){
  if(/<STMTTRN>/i.test(texto)) return lerOfx(texto).map(r=>montarLinha(r.bruto, Math.abs(r.valor), r.data, compRef, r.credito));
  const porLinha = lerLinhas(texto, compRef);
  const soltos = texto.split(/\r?\n/).map(l=>l.trim()).filter(soValor).length;
  if(soltos >= 2 && porLinha.length < soltos){
    const blocos = lerBlocos(texto, compRef);
    if(blocos.length > porLinha.length) return blocos;
  }
  return porLinha;
}
function lerLinhas(texto, compRef){
  const linhas = texto.split(/\r?\n/);
  const out = [];
  for(const cru of linhas){
    const linha = cru.trim();
    if(!linha || linha.length < 5) continue;
    if(/^(data|date|título|titulo|descri|lançamento|valor|categoria)/i.test(linha) && !/\d,\d{2}|\d\.\d{2}/.test(linha)) continue;
    let desc = "", valor = NaN, data = null;
    const campos = fatiar(linha);
    if(campos && campos.length>=2){
      const limpos = campos.map(c=>c.trim().replace(/^"|"$/g,""));
      let iVal = -1;
      for(let i=limpos.length-1;i>=0;i--){
        if(/^[-+(]?\s*R?\$?\s*\d[\d.,]*\)?$/.test(limpos[i]) && /[.,]\d{2}$/.test(limpos[i])){ iVal = i; break; }
      }
      if(iVal<0) for(let i=limpos.length-1;i>=0;i--){ const v=moeda(limpos[i]); if(isFinite(v)&&v!==0){ iVal=i; break; } }
      if(iVal<0) continue;
      valor = moeda(limpos[iVal]);
      for(let i=0;i<limpos.length;i++){
        if(i===iVal) continue;
        if(!data && pareceData(limpos[i])){ data = acharData(limpos[i], compRef); continue; }
        if(limpos[i].length > desc.length) desc = limpos[i];
      }
    }else{
      const mv = linha.match(/-?\s*R?\$?\s*\d{1,3}(?:\.\d{3})*,\d{2}|-?\s*R?\$?\s*\d+[.,]\d{2}/g);
      if(!mv) continue;
      valor = moeda(mv[mv.length-1]);
      let resto = linha.replace(mv[mv.length-1], " ");
      const inicio = resto.match(/^\s*(\d{4}-\d{2}-\d{2}|\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?|\d{1,2}\s*(?:de\s*)?(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\w*\.?(?:\s*(?:de\s*)?\d{2,4})?)\s+/i);
      if(inicio){ data = acharData(inicio[1], compRef); resto = resto.slice(inicio[0].length); }
      else {
        const completo = resto.match(/\d{4}-\d{2}-\d{2}|\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}/);
        if(completo){ data = acharData(completo[0], compRef); resto = resto.replace(completo[0], " "); }
      }
      desc = resto;
    }
    desc = desc.replace(/\s{2,}/g," ").replace(/^[\s\-–|•]+|[\s\-–|•]+$/g,"").trim();
    if(!desc || !isFinite(valor) || valor===0) continue;
    out.push(montarLinha(desc, valor, data, compRef));
  }
  return out;
}
function montarLinha(desc, valor, data, compRef, forcar){
  const pc = tirarParcela(desc);
  const parcAtual = pc.a, parcTotal = pc.t;
  desc = pc.desc;
  const ignorar = !!forcar || IGNORAR_RX.test(desc) || valor < 0;
  return {
    usar: !ignorar, desc: desc || "Sem descrição", valor: Math.abs(valor),
    data: data || (compRef+"-15"), parcAtual, parcTotal,
    cat: categoriaDe(desc), dela: false, ignorar
  };
}

function renderImpTabela(){
  const box = el("#im-resultado");
  if(!impLinhas.length){ box.classList.add("oculto"); return; }
  box.classList.remove("oculto");
  const usados = impLinhas.filter(l=>l.usar);
  const soma = usados.reduce((s,l)=>s + (l.parcTotal>1 ? l.valor : l.valor), 0);
  el("#im-qtd").textContent = usados.length+" de "+impLinhas.length+" · "+R$(soma)+" neste mês";
  const opcoes = c => S.config.cats.map(x=>'<option'+(x===c?" selected":"")+'>'+esc(x)+'</option>').join("");
  el("#im-tabela").className = "im-tab";
  el("#im-tabela").innerHTML =
    '<thead><tr><th></th><th>Descrição</th><th>Categoria</th><th>Parcela</th><th style="text-align:right">Valor</th><th>'+esc(nomeEla())+'</th></tr></thead><tbody>'
    + impLinhas.map((l,i)=>
      '<tr class="'+(l.usar?"":"fora")+'">'
      + '<td><input type="checkbox" data-imp="usar" data-i="'+i+'"'+(l.usar?" checked":"")+' aria-label="Importar esta linha"></td>'
      + '<td><input type="text" data-imp="desc" data-i="'+i+'" value="'+esc(l.desc)+'"></td>'
      + '<td><select data-imp="cat" data-i="'+i+'">'+opcoes(l.cat)+'</select></td>'
      + '<td class="p">'+(l.parcTotal>1 ? l.parcAtual+"/"+l.parcTotal : "—")+'</td>'
      + '<td class="n">'+R$(l.valor)+'</td>'
      + '<td><input type="checkbox" data-imp="dela" data-i="'+i+'"'+(l.dela?" checked":"")+' aria-label="Gasto de outra pessoa"></td>'
      + '</tr>').join("")
    + '</tbody>';
}
function importarLinhas(){
  const cartao = el("#im-cartao").value;
  if(!cartao){ torrada("Escolha o cartão antes."); return; }
  const comp = el("#im-comp").value || mes;
  let n = 0, pulados = 0;
  for(const l of impLinhas){
    if(!l.usar) continue;
    const parcelas = l.parcTotal>1 ? l.parcTotal : 1;
    const atual = l.parcTotal>1 ? l.parcAtual : 1;
    const compInicio = compSoma(comp, -(atual-1));
    const dup = S.compras.some(c=>c.cartao===cartao && c.desc===l.desc && c.compInicio===compInicio
      && Math.abs(valorParcela(c,1) - l.valor) < 0.02 && c.parcelas===parcelas);
    if(dup){ pulados++; continue; }
    S.compras.push({id:id(), cartao, dela:l.dela, desc:l.desc,
      valorTotal: Math.round(l.valor*parcelas*100)/100, avista:0,
      parcelas, compInicio, cat:l.cat, data:l.data});
    n++;
  }
  impLinhas = [];
  el("#im-texto").value = "";
  agendarSalvar();
  mes = comp; aba = "painel"; render();
  window.scrollTo({top:0,behavior:"smooth"});
  torrada(n+" lançamento"+(n===1?"":"s")+" importado"+(n===1?"":"s")+(pulados? " · "+pulados+" já existia"+(pulados===1?"":"m") : ""));
}

let edAtual = null;   // {tipo:'l'|'c', id}
function selCats(sel, atual, lista){
  sel.innerHTML = (lista||S.config.cats).map(c=>'<option'+(c===atual?" selected":"")+'>'+esc(c)+'</option>').join("");
}
function abrirEditor(origem, ref){
  const lanc = origem==="l" ? S.lancamentos.find(x=>x.id===ref) : null;
  const compra = origem==="c" ? S.compras.find(x=>x.id===ref) : null;
  const o = lanc || compra;
  if(!o) return;
  edAtual = {tipo:origem, id:ref};
  const ehEntrada = !!lanc && lanc.tipo==="entrada";
  const ehParc = !!compra;
  const ehFin = ehParc && !!compra.fin;

  el("#ed-titulo").textContent = ehEntrada ? "Editar entrada" : ehParc ? (ehFin?"Editar "+rotuloDivida(compra).toLowerCase():"Editar compra no cartão") : "Editar gasto";
  el("#ed-sub").textContent = ehParc ? compra.parcelas+"x" : (lanc.fixo ? "fixo" : "avulso");
  el("#ed-desc").value = o.desc || "";
  el("#ed-valor-rot").textContent = ehParc ? "Valor da parcela (R$)" : "Valor (R$)";
  el("#ed-valor").value = (ehParc ? valorParcela(compra,1) : o.valor).toFixed(2).replace(".",",");
  el("#ed-data").value = o.data || iso(hoje());
  selCats(el("#ed-cat"), o.cat, ehEntrada ? S.config.catsEnt : S.config.cats);
  el("#ed-quem").innerHTML = '<option value="eu">Eu</option><option value="ela">'+esc(nomeEla())+'</option>';
  el("#ed-quem").value = o.dela ? "ela" : "eu";
  el("#ed-fixo").checked = !!(lanc && lanc.fixo);
  el("#ed-fixo-rot").textContent = ehEntrada ? "Repete todo mês (salário, pró-labore)" : "Repete todo mês (fixo)";
  el("#ed-reemb").checked = !!(lanc && lanc.reemb);
  el("#ed-reemb-rot").textContent = "É o que "+nomeEla()+" me paga de volta";

  if(ehParc){
    el("#ed-parcelas").value = compra.parcelas;
    el("#ed-comp").value = compra.compInicio;
    el("#ed-comp-rot").textContent = ehFin ? "1ª parcela em" : "1ª parcela na fatura de";
    el("#ed-avista-rot").textContent = ehFin ? "Valor financiado (opcional)" : "Preço à vista (opcional)";
    el("#ed-avista").value = compra.avista ? String(compra.avista).replace(".",",") : "";
    el("#ed-cartao").innerHTML = S.cartoes.map(c=>'<option value="'+c.id+'"'+(c.id===compra.cartao?" selected":"")+'>'+esc(c.nome)+'</option>').join("");
    el("#ed-tipodiv").value = compra.tipoDiv || "financiamento";
  }
  els(".ed-parc").forEach(n=>n.classList.toggle("oculto", !ehParc));
  els(".ed-cartao").forEach(n=>n.classList.toggle("oculto", !ehParc || ehFin));
  els(".ed-tipodiv").forEach(n=>n.classList.toggle("oculto", !ehFin));
  els(".ed-avista").forEach(n=>n.classList.toggle("oculto", !ehParc));
  els(".ed-fixo").forEach(n=>n.classList.toggle("oculto", ehParc));
  els(".ed-reemb").forEach(n=>n.classList.toggle("oculto", !ehEntrada));
  els(".ed-quem").forEach(n=>n.classList.toggle("oculto", ehEntrada));
  els(".ed-data").forEach(n=>n.classList.toggle("oculto", false));
  previaEditor();
  el("#dlg-editar").showModal();
}
function previaEditor(){
  const box = el("#ed-previa");
  if(!edAtual || edAtual.tipo!=="c"){ box.classList.add("oculto"); return; }
  const compra = S.compras.find(x=>x.id===edAtual.id); if(!compra){ box.classList.add("oculto"); return; }
  const parcela = num(el("#ed-valor").value);
  const n = Math.max(1, parseInt(el("#ed-parcelas").value||"1",10));
  const c0 = el("#ed-comp").value || compra.compInicio;
  const d = compra.fin ? 0 : deslocCartao(el("#ed-cartao").value || compra.cartao);
  const fim = compSoma(c0, n-1+d);
  const prim = compSoma(c0, d);
  box.innerHTML = "<span>◆</span><span>Total de <b>"+R$(parcela*n)+"</b> em "+n+"x. "
    + "Sai da conta de <b>"+compRotulo(prim)+"</b> até <b>"+compRotulo(fim)+"</b>.</span>";
  box.classList.remove("oculto");
}
function salvarEditor(){
  if(!edAtual) return;
  const desc = el("#ed-desc").value.trim();
  const valor = num(el("#ed-valor").value);
  if(!desc || valor<=0){ torrada("Preencha descrição e valor."); return; }
  if(edAtual.tipo==="l"){
    const l = S.lancamentos.find(x=>x.id===edAtual.id); if(!l) return;
    l.desc = desc; l.valor = valor;
    l.data = el("#ed-data").value || l.data;
    l.comp = compDe(l.data);
    l.cat = el("#ed-cat").value;
    if(l.tipo==="entrada"){ l.reemb = el("#ed-reemb").checked; l.dela = false; }
    else l.dela = el("#ed-quem").value==="ela";
    l.fixo = el("#ed-fixo").checked;
  }else{
    const c = S.compras.find(x=>x.id===edAtual.id); if(!c) return;
    const n = Math.max(1, parseInt(el("#ed-parcelas").value||"1",10));
    c.desc = desc; c.parcelas = n;
    c.valorTotal = Math.round(valor*n*100)/100;
    c.avista = num(el("#ed-avista").value)||0;
    c.compInicio = el("#ed-comp").value || c.compInicio;
    c.data = el("#ed-data").value || c.data;
    c.cat = el("#ed-cat").value;
    c.dela = el("#ed-quem").value==="ela";
    if(c.fin) c.tipoDiv = el("#ed-tipodiv").value;
    else c.cartao = el("#ed-cartao").value || c.cartao;
  }
  el("#dlg-editar").close();
  edAtual = null;
  agendarSalvar(); render();
  torrada("Lançamento atualizado.");
}

/* ===================== detalhe (drill-down) ===================== */
function abrirDetalhe(titulo, sub, itens){
  const dlg = el("#dlg-lista");
  el("#dl-titulo").textContent = titulo;
  el("#dl-sub").textContent = sub || "";
  const tot = itens.reduce((s,i)=>s + (i.sinal==="+" ? i.valor : i.valor), 0);
  el("#dl-total").textContent = R$(tot);
  el("#dl-total").className = "dl-total mono " + (itens.length && itens[0].sinal==="+" ? "pos" : "");
  el("#dl-lista").innerHTML = itens.length ? itens.map(i=>
    '<div class="item"><div class="icone">'+(i.icone||"•")+'</div>'
    + '<div class="desc"><b>'+esc(i.titulo)+'</b><small>'+(i.sub||"")+'</small></div>'
    + '<div class="num'+(i.sinal==="+"?" pos":"")+'">'+(i.sinal||"")+" "+R$(i.valor)+'</div></div>'
  ).join("") : '<div class="vazio"><b>Nada aqui neste mês</b>Nenhum lançamento se encaixa neste filtro.</div>';
  dlg.showModal();
}
function reembolsoDela(comp){
  return S.lancamentos.filter(l=>l.tipo==="entrada" && l.reemb && ativoNoMes(l,comp))
    .reduce((s,l)=>s+l.valor,0);
}
function itensEntradas(comp, f){
  return S.lancamentos.filter(l=>l.tipo==="entrada" && ativoNoMes(l,comp) && (!f || f(l.dela)))
    .sort((a,b)=>b.valor-a.valor)
    .map(l=>({icone:"↑", titulo:l.desc, sub:(l.cat||"")+(l.fixo?" · fixo":"")+(l.dela?" · "+esc(nomeEla()):""), valor:l.valor, sinal:"+"}));
}
function itensAVista(comp, f){
  return S.lancamentos.filter(l=>l.tipo==="gasto" && ativoNoMes(l,comp) && (!f || f(l.dela)))
    .sort((a,b)=>b.valor-a.valor)
    .map(l=>({icone:"↓", titulo:l.desc, sub:(l.cat||"")+(l.fixo?" · fixo":"")+(l.dela?" · "+esc(nomeEla()):""), valor:l.valor, sinal:"−"}));
}
function itensParcelas(comp, f, filtroCompra){
  return parcelasPagasEm(comp, f)
    .filter(p=>!filtroCompra || filtroCompra(p.compra))
    .sort((a,b)=>b.valor-a.valor)
    .map(p=>({
      icone: p.compra.fin ? "🏦" : "💳",
      titulo: p.compra.desc,
      sub: (p.compra.cat||"") + " · " + p.n+"/"+p.compra.parcelas
         + (p.compra.fin ? " · "+rotuloDivida(p.compra) : " · fatura de "+compRotulo(p.faturaDe,true))
         + (p.compra.dela ? " · "+esc(nomeEla()) : ""),
      valor: p.valor, sinal:"−"
    }));
}
function itensSaidas(comp, f){
  return itensAVista(comp,f).concat(itensParcelas(comp,f)).sort((a,b)=>b.valor-a.valor);
}

function render(){
  if(!S) return;
  renderSeg(); renderAbas();
  el("#mes-abre").textContent = cap(MESES_CURTO[Number(mes.split("-")[1])-1]) + " " + mes.split("-")[0];
  renderPicker();
  els(".vista").forEach(v=>v.classList.toggle("ativa", v.id === "v"+"-"+aba));
  els("#abas button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.aba===aba)));
  if(aba==="painel") renderPainel();
  if(aba==="lancar") renderLancar();
  if(aba==="importar") renderImportar();
  if(aba==="cartoes") renderCartoes();
  if(aba==="parcelas") renderParcelas();
  if(aba==="projecao") renderProjecao();
  if(aba==="analise") renderAnalise();
  if(aba==="ajustes") renderAjustes();
  el("#fab").classList.toggle("oculto", aba==="lancar");
  marcarStatus();
}
function temMovimento(comp){
  for(const l of S.lancamentos) if(ativoNoMes(l,comp)) return true;
  return parcelasPagasEm(comp).length > 0;
}
function renderPicker(){

      + (c===compHoje()?' class="agora"':'')

}

function renderPainel(){
  const f = filtroAtual(), fx = fluxo(mes, f);
  const saldo = fx.saldo;
  el("#p-saldo").textContent = R$(saldo);
  el("#p-saldo").className = "valor " + (saldo>=0?"pos":"neg");
  const pct = fx.ent>0 ? Math.min(100, Math.round((fx.saida/fx.ent)*100)) : (fx.saida>0?100:0);
  const b = el("#p-barra"); b.style.width = pct+"%";
  b.className = pct>=100?"neg":pct>=85?"wrn":"pos";
  el("#p-saldo-sub").textContent = fx.ent>0 ? pct+"% da renda comprometida" : "sem entradas lançadas neste mês";
  el("#p-entrou").textContent = R$(fx.ent);
  el("#p-entrou-sub").textContent = "entradas do mês";
  el("#p-saiu").textContent = R$(fx.saida);
  el("#p-saiu-sub").textContent = R$(fx.fat)+" em faturas"
    + (fx.fin>0 ? " · "+R$(fx.fin)+" em parcelas sem cartão" : "")
    + " · "+R$(fx.gas)+" à vista";

  const fd = fluxo(mes, d=>!!d);
  const totalDela = fd.gas + fd.fat;
  const cardDela = el("#card-dela");
  cardDela.classList.toggle("oculto", totalDela<=0 || ver==="meus");
  if(totalDela>0){
    const reemb = reembolsoDela(mes);
    const dif = Math.round((totalDela - reemb)*100)/100;
    el("#p-dela-rot").textContent = "Gastos de "+nomeEla();
    el("#p-dela").textContent = R$(totalDela);
    el("#p-dela").className = "valor" + (reemb>0 ? (Math.abs(dif)<0.01 ? " pos" : " wrn") : "");
    el("#p-dela-sub").textContent = reemb>0
      ? "ela te paga "+R$(reemb)+" · "+(Math.abs(dif)<0.01 ? "bate certinho"
          : dif>0 ? "faltam "+R$(dif) : "sobram "+R$(-dif))
      : (fx.saida>0 ? Math.round(totalDela/fx.saida*100)+"% de tudo que saiu" : "");
  }

  // faturas a pagar neste mês (caixa)
  const lista = el("#p-faturas");
  if(!S.cartoes.length){
    lista.innerHTML = '<div class="vazio"><b>Nenhum cartão cadastrado</b>Cadastre na aba Cartões para acompanhar as faturas.</div>';
    el("#p-fat-total").textContent = "";
  }else{
    let tot = 0;
    const pagas = parcelasPagasEm(mes, f);
    lista.innerHTML = S.cartoes.map(c=>{
      const v = faturaCartao(c.id, mes, f); tot += v;
      const doCard = pagas.filter(p=>p.compra.cartao===c.id);
      const ps = doCard.length;
      const de = doCard.length ? doCard[0].faturaDe : compSoma(mes, -deslocCartao(c.id));
      return '<div class="item clicavel" data-fatura="'+c.id+'"><div class="icone">💳</div>'
        + '<div class="desc"><b>'+esc(c.nome)+'</b><small>'
        + 'fatura de '+compRotulo(de,true)+' · vence '+String(c.vencimento).padStart(2,"0")+'/'+mes.split("-")[1]
        + ' · '+ps+' parcela'+(ps===1?"":"s")+'</small></div>'
        + '<div class="num">'+R$(v)+'</div></div>';
    }).join("");
    el("#p-fat-total").textContent = R$(tot);
  }

  // fatura fechando neste mês (competência)
  const fech = fechandoCartao(mes, f);
  const cardFech = el("#card-fechando");
  cardFech.classList.toggle("oculto", fech<=0);
  if(fech>0){
    const abertas = parcelasDe(mes, f).filter(p=>!p.compra.fin);
    el("#p-fech-quando").textContent = "você paga em " + compRotulo(compSoma(mes,1), true);
    el("#p-fechando").innerHTML = S.cartoes.map(c=>{
      const v = faturaFechando(c.id, mes, f);
      if(v<=0) return "";
      const n = abertas.filter(p=>p.compra.cartao===c.id).length;
      const uso = c.limite ? Math.min(100, Math.round(v/c.limite*100)) : 0;
      return '<div class="item clicavel" data-fechando="'+c.id+'"><div class="icone">🧾</div>'
        + '<div class="desc"><b>'+esc(c.nome)+'</b><small>fecha dia '+esc(c.fechamento)
        + ' · vence '+String(c.vencimento).padStart(2,"0")+'/'+compSoma(mes,deslocCartao(c.id)).split("-")[1]
        + ' · '+n+' lançamento'+(n===1?"":"s")
        + (c.limite? ' · '+uso+'% do limite':'')+'</small></div>'
        + '<div class="num">'+R$(v)+'</div></div>';
    }).join("");
  }

  // trilho
  const dados = [];
  for(let i=0;i<12;i++){
    const c = compSoma(mes, i), fl = fluxo(c, f);
    dados.push({c, fat:fl.fat, fin:fl.fin, fix:fl.fixos});
  }
  const teto = Math.max(1, ...dados.map(d=>d.fat+d.fin+d.fix));
  const temFin = dados.some(d=>d.fin>0);
  el("#leg-fin").classList.toggle("oculto", !temFin);
  el("#p-trilho").innerHTML = dados.map((d,i)=>{
    const soma = d.fat+d.fin+d.fix;
    const hf = Math.round(d.fat/teto*92), hn = Math.round(d.fin/teto*92), hx = Math.round(d.fix/teto*92);
    return '<button type="button" class="m" data-comp="'+d.c+'" data-atual="'+(i===0?1:0)+'">'
      + '<span class="val">'+(soma>0?brlCurto.format(soma):"")+'</span>'
      + '<span class="col"><span class="fat" style="height:'+hf+'%"></span><span class="fin" style="height:'+hn+'%"></span><span class="fix" style="height:'+hx+'%"></span></span>'
      + '<span class="rot-m">'+compRotulo(d.c,true)+'</span></button>';
  }).join("");

  // movimento
  const movs = [];
  for(const l of S.lancamentos){
    if(f && !f(l.dela)) continue;
    if(!ativoNoMes(l,mes)) continue;
    movs.push({tipo:l.tipo, desc:l.desc, cat:l.cat, dela:l.dela, valor:l.valor, data:l.data, fixo:l.fixo, ref:l.id, origem:"l"});
  }
  for(const p of parcelasPagasEm(mes, f)){
    movs.push({tipo:"parcela", fin:p.compra.fin, desc:p.compra.desc, cat:p.compra.cat, dela:p.compra.dela, valor:p.valor,
      data:p.compra.data, extra:p.n+"/"+p.compra.parcelas,
      fatura: p.compra.fin ? "" : "fatura de "+compRotulo(p.faturaDe,true),
      ref:p.compra.id, origem:"c"});
  }
  movs.sort((a,b)=> (b.data||"").localeCompare(a.data||""));
  el("#p-mov-qtd").textContent = movs.length ? movs.length+" itens" : "";
  el("#p-movimento").innerHTML = movs.length ? movs.map(m=>{
    const sinal = m.tipo==="entrada" ? "pos":"";
    const ic = m.tipo==="entrada"?"↑":m.tipo==="parcela"?(m.fin?"🏦":"💳"):"↓";
    return '<div class="item clicavel" data-editar="'+m.origem+':'+m.ref+'"><div class="icone">'+ic+'</div>'
      + '<div class="desc"><b>'+esc(m.desc)+'</b><small>'
      + (m.cat?esc(m.cat):"")
      + (m.dela? ' · '+etiqueta(true):"")
      + (m.extra? ' · <span class="mono">'+m.extra+'</span>':"")
      + (m.fatura? ' · '+esc(m.fatura):"")
      + (m.fixo? ' · fixo':"")
      + '</small></div>'
      + '<div class="num '+sinal+'">'+(m.tipo==="entrada"?"+ ":"− ")+R$(m.valor)+'</div>'
      + '<button type="button" class="btn fantasma mini" data-apagar="'+m.origem+':'+m.ref+'" title="Apagar">✕</button></div>';
  }).join("") : '<div class="vazio"><b>Mês em branco</b>Use o botão + para lançar o primeiro gasto ou entrada.</div>';
}

function compInicioFin(){
  const atual = Math.max(1, parseInt(el("#f-atual").value||"1",10));
  return compSoma(compHoje(), -(atual-1));
}
function atualizarPrevia(){
  const tipo = el("#seg-tipo").querySelector('[aria-pressed="true"]').dataset.tipo;
  const box = el("#f-previa");
  if(tipo==="fin"){
    const parcela = num(el("#f-valor").value);
    const n = Math.max(1, parseInt(el("#f-parcelas").value||"1",10));
    const atual = Math.min(n, Math.max(1, parseInt(el("#f-atual").value||"1",10)));
    if(!parcela){ box.classList.add("oculto"); return; }
    const c0 = compInicioFin(), fim = compSoma(c0, n-1);
    const faltam = n - atual + 1;
    const financiado = num(el("#f-avista").value);
    let t = n+"x de "+R$(parcela)+" · 1ª em "+compRotulo(c0)+" · última em "+compRotulo(fim)
      + " · faltam "+faltam+" parcela"+(faltam===1?"":"s")+" ("+R$(faltam*parcela)+")";
    if(financiado>0 && parcela*n>financiado)
      t += " · juros de "+R$(parcela*n-financiado)+" no total";
    box.textContent = t; box.classList.remove("oculto"); return;
  }
  if(tipo!=="cartao"){ box.classList.add("oculto"); return; }
  const total = num(el("#f-valor").value), n = Math.max(1, parseInt(el("#f-parcelas").value||"1",10));
  const cart = S.cartoes.find(c=>c.id===el("#f-cartao").value);
  const data = el("#f-data").value || iso(hoje());
  const c0 = el("#f-comp").value || primeiraComp(data, cart);
  if(!total){ box.classList.add("oculto"); return; }
  const p = Math.round(total/n*100)/100;
  const fim = compSoma(c0, n-1);
  const avista = num(el("#f-avista").value);
  let txt = n+"x de "+R$(p)+" · 1ª em "+compRotulo(c0)+" · última em "+compRotulo(fim);
  if(cart) txt += " · vence dia "+cart.vencimento;
  if(avista>0 && total>avista) txt += " · juros de "+R$(total-avista)+" ("+Math.round((total/avista-1)*100)+"%)";
  box.textContent = txt; box.classList.remove("oculto");
}

function gastosPorCategoria(meses){
  const mapa = {};
  for(let i=0;i<meses;i++){
    const c = compSoma(mes,-i);
    for(const l of S.lancamentos){
      if(l.tipo!=="gasto" || !ativoNoMes(l,c)) continue;
      mapa[l.cat||"Outros"] = (mapa[l.cat||"Outros"]||0) + l.valor;
    }
    for(const p of parcelasPagasEm(c)){
      const k = p.compra.cat||"Outros";
      mapa[k] = (mapa[k]||0) + p.valor;
    }
  }
  return Object.keys(mapa).map(k=>({cat:k, valor:mapa[k]})).sort((a,b)=>b.valor-a.valor);
}
function analisar(){
  const f = filtroAtual();
  const fx = fluxo(mes,f);
  const out = [];
  const renda = fx.ent;
  const falta = dividaFutura(mes,f);

  if(renda>0){
    const pctFat = fx.fat/renda*100;
    out.push({
      nivel: pctFat>50?"critico":pctFat>30?"atencao":"bom",
      titulo:"Cartão x renda",
      texto: "A fatura que vence neste mês come <b>"+pctFat.toFixed(0)+"%</b> do que entra. "
        + (pctFat>50?"Acima de 50% o mês vira malabarismo: evite parcelar qualquer coisa nova até baixar disso."
          : pctFat>30?"Entre 30% e 50% dá para respirar, mas uma emergência aperta. Segure novos parcelamentos."
          : "Abaixo de 30% é uma zona confortável.")
    });
    const taxa = fx.saldo/renda*100;
    out.push({
      nivel: taxa<0?"critico":taxa<10?"atencao":"bom",
      titulo:"Quanto sobra",
      texto: taxa<0
        ? "Você está fechando o mês <b>"+R$(Math.abs(fx.saldo))+"</b> no vermelho. É esse buraco que empurra gasto novo para o cartão."
        : "Sobram <b>"+R$(fx.saldo)+"</b>, ou <b>"+taxa.toFixed(0)+"%</b> da renda. "+(taxa<10?"Guardar 20% é a meta clássica; hoje falta "+R$(renda*0.2-fx.saldo)+" por mês para chegar lá.":"Está acima dos 20% que costumam ser a meta. Segure esse ritmo.")
    });
  }else{
    out.push({nivel:"info",titulo:"Falta lançar as entradas",texto:"Sem salário ou pró-labore lançados eu não consigo calcular percentuais. Lance como <b>entrada fixa</b> e o resto se ajeita sozinho."});
  }

  if(renda>0 && fx.fin>0){
    const pctT = (fx.fat+fx.fin)/renda*100;
    out.push({
      nivel: pctT>50?"critico":pctT>35?"atencao":"bom",
      titulo:"Dívida fixa x renda",
      texto:"Cartão e parcelas fixas juntos comem <b>"+pctT.toFixed(0)+"%</b> do que entra — <b>"+R$(fx.fat+fx.fin)+"</b> por mês que já têm dono antes de você acordar. "
        + (pctT>50?"Acima de 50% qualquer imprevisto vira dívida nova."
          : pctT>35?"É bastante. Antes de assumir qualquer parcela nova, veja o mês mais apertado logo abaixo."
          : "É um patamar administrável.")
    });
  }

  const fech = fechandoCartao(mes, f);
  if(fech>0 || fx.fat>0){
    const dif = fech - fx.fat;
    out.push({
      nivel: dif > fx.fat*0.25 && fx.fat>0 ? "atencao" : "info",
      titulo:"O que vem pela frente",
      texto:"Neste mês sai <b>"+R$(fx.fat)+"</b> de fatura e você já lançou <b>"+R$(fech)+"</b> em compras novas, que vão vencer em "+compRotulo(compSoma(mes,1))+". "
        + (dif>0 ? "São <b>"+R$(dif)+"</b> a mais do que está saindo agora — o mês que vem chega mais pesado."
          : dif<0 ? "É <b>"+R$(-dif)+"</b> a menos do que está saindo agora: a fatura está encolhendo."
          : "Os dois valores estão parelhos.")
    });
  }

  // pior mês
  let pior=null;
  for(let i=0;i<12;i++){
    const c = compSoma(mes,i), fl = fluxo(c,f);
    if(!pior || fl.saldo < pior.saldo) pior = {c, saldo:fl.saldo, fat:fl.fat};
  }
  if(pior && renda>0){
    out.push({
      nivel: pior.saldo<0?"atencao":"bom",
      titulo:"Mês mais apertado à frente",
      texto: (pior.saldo<0
        ? "<b>"+compRotulo(pior.c)+"</b> fecha negativo em <b>"+R$(Math.abs(pior.saldo))+"</b>, com "+R$(pior.fat)+" de fatura. Vale antecipar parcela ou segurar gasto grande até lá."
        : "O mês mais magro dos próximos 12 é <b>"+compRotulo(pior.c)+"</b>, e mesmo assim sobra "+R$(pior.saldo)+".")
    });
  }

  const uc = ultimaComp("cartao"), uf = ultimaComp("fin");
  if((uc && uc>=mes) || (uf && uf>=mes)){
    let t = "Já estão comprometidos <b>"+R$(falta)+"</b> — dinheiro que saiu do seu bolso, só não saiu da conta ainda. ";
    if(uc && uc>=mes) t += "A última parcela de cartão cai em <b>"+compRotulo(uc)+"</b>. ";
    if(uf && uf>=mes) t += "As parcelas fora do cartão vão até <b>"+compRotulo(uf)+"</b>"+(uc&&uc>=mes?", e é ele que segura a sua data da virada.":".");
    out.push({nivel:"info", titulo:"Quando você se livra", texto:t});
  }

  const cats = gastosPorCategoria(3);
  if(cats.length){
    const top = cats.slice(0,3);
    const soma = top.reduce((s,c)=>s+c.valor,0);
    const corte = soma*0.15/3;
    out.push({
      nivel:"info", titulo:"Onde cortar primeiro",
      texto: top.map(c=>c.cat).join(", ")+" somam <b>"+R$(soma)+"</b> nos últimos 3 meses. Cortar 15% só nessas três libera <b>"+R$(corte)+"</b> por mês, ou "+R$(corte*12)+" no ano."
    });
  }

  if(ver!=="meus"){
    const fd = fluxo(mes, d=>!!d), td = fd.gas + fd.fat;
    if(td>0){
      const tot = fx.saida || 1;
      const reemb = reembolsoDela(mes);
      const dif = Math.round((td - reemb)*100)/100;
      out.push({
        nivel: reemb>0 ? (Math.abs(dif)<0.01 ? "bom" : "atencao") : "info",
        titulo:"Acerto com "+nomeEla(),
        texto:"Ela gastou <b>"+R$(td)+"</b> neste mês"
          + (fd.fat>0? ", sendo "+R$(fd.fat)+" em parcelas do cartão":"")
          + ". " + (reemb>0
            ? "Você lançou <b>"+R$(reemb)+"</b> como o que ela te paga de volta — "
              + (Math.abs(dif)<0.01 ? "bate certinho."
                : dif>0 ? "ainda faltam <b>"+R$(dif)+"</b> para fechar."
                : "são <b>"+R$(-dif)+"</b> a mais do que ela gastou.")
            : "Marque a entrada dela como <b>reembolso</b> na hora de lançar e eu passo a comparar os dois números todo mês.")
      });
    }
  }

  let juros=0;
  for(const c of S.compras){ if(c.avista && c.valorTotal>c.avista) juros += c.valorTotal-c.avista; }
  if(juros>0) out.push({nivel:"atencao",titulo:"Juros que você já aceitou",texto:"Somando as compras em que você informou o preço à vista, o parcelamento custou <b>"+R$(juros)+"</b> a mais. É o preço da conveniência — vale conferir se compensou."});

  return out;
}
function dataDaVirada(){
  const f = filtroAtual();
  const fx = fluxo(mes,f);
  const despesaMedia = fx.gas + fx.fat;
  const reserva = despesaMedia*6;
  if(fx.ent<=0) return {txt:"Ainda não dá para dizer", sub:"Lance suas entradas fixas (salário, pró-labore) e eu calculo a data."};
  let caixa = 0, comp = mes, quitado = null;
  for(let i=0;i<120;i++){
    const c = compSoma(mes,i), fl = fluxo(c,f);
    caixa += fl.saldo;
    const div = dividaFutura(compSoma(c,1), f);
    if(!quitado && div<=0.01) quitado = c;
    if(quitado && caixa >= reserva && reserva>0) return {
      txt: cap(compRotulo(c)),
      sub: "Nessa data o cartão está limpo e você tem "+R$(reserva)+" guardados — seis meses de despesa. Mantendo o ritmo atual de "+R$(fl.saldo)+" por mês."
    };
    comp = c;
  }
  if(fx.saldo<=0) return {txt:"Não chega assim", sub:"Fechando o mês no zero ou no vermelho, a reserva nunca se forma. O primeiro passo é fazer sobrar qualquer coisa — mesmo R$ 100."};
  return {txt:"Mais de 10 anos", sub:"No ritmo de hoje demora demais. Reduzir uma categoria grande ou aumentar entrada muda essa conta rápido."};
}
function renderAnalise(){
  const v = dataDaVirada();
  el("#an-virada").textContent = v.txt;
  el("#an-virada-sub").textContent = v.sub;
  el("#an-lista").innerHTML = analisar().map(i=>
    '<div class="insight '+i.nivel+'"><div class="faixa"></div><div><h3>'+esc(i.titulo)+'</h3><p>'+i.texto+'</p></div></div>'
  ).join("");
  const cats = gastosPorCategoria(3);
  const teto = cats.length?cats[0].valor:1;
  el("#an-categorias").innerHTML = cats.length ? cats.slice(0,8).map(c=>
    '<div class="item"><div class="desc"><b>'+esc(c.cat)+'</b>'
    + '<div class="barra" style="max-width:260px"><i style="width:'+Math.round(c.valor/teto*100)+'%"></i></div></div>'
    + '<div class="num">'+R$(c.valor)+'</div></div>'
  ).join("") : '<div class="vazio"><b>Sem gastos nos últimos 3 meses</b>Lance alguns para eu montar o ranking.</div>';
}
function resumoTexto(){
  const f = filtroAtual(), fx = fluxo(mes,f);
  const l = [];
  l.push("Resumo Nosso Caixa — "+compRotulo(mes)+" (filtro: "+rotuloFiltro()+")");
  l.push("Entradas: "+R$(fx.ent)+" | Gastos à vista: "+R$(fx.gas)+" | Faturas: "+R$(fx.fat)+" | Sobra: "+R$(fx.saldo));
  l.push("Dívida à frente (cartão + financiamento): "+R$(dividaFutura(mes,f))+(ultimaComp()?" (última parcela em "+compRotulo(ultimaComp())+")":""));
  if(ultimaComp("fin")) l.push("Financiamento: "+R$(fluxo(mes,f).fin)+" por mês até "+compRotulo(ultimaComp("fin")));
  l.push("");
  l.push("Projeção 12 meses (mês | entradas | gastos | faturas | financiamento | sobra):");
  for(let i=0;i<12;i++){
    const c = compSoma(mes,i), fl = fluxo(c,f);
    l.push(compRotulo(c,true)+" | "+fl.ent.toFixed(2)+" | "+fl.gas.toFixed(2)+" | "+fl.fat.toFixed(2)+" | "+fl.fin.toFixed(2)+" | "+fl.saldo.toFixed(2));
  }
  l.push("");
  const fdr = fluxo(mes, d=>!!d);
  l.push("Gastos de "+nomeEla()+" no mês: "+(fdr.gas+fdr.fat).toFixed(2));
  l.push("");
  l.push("Gastos por categoria (3 meses):");
  gastosPorCategoria(3).forEach(c=>l.push("- "+c.cat+": "+c.valor.toFixed(2)));
  l.push("");
  l.push("Parcelas em aberto (cartão e financiamento):");
  S.compras.filter(c=>compSoma(c.compInicio,c.parcelas-1)>=mes).forEach(c=>{
    const k = compDelta(c.compInicio,mes);
    l.push("- "+c.desc+(c.fin?" [financiamento]":"")+": "+c.parcelas+"x de "+valorParcela(c,1).toFixed(2)+", na "+Math.max(1,k+1)+"ª, termina "+compRotulo(compSoma(c.compInicio,c.parcelas-1),true));
  });
  return l.join("\n");
}

      S.compras.push({id:id(), fin:true, tipoDiv: el("#f-tipodiv").value, dela: el("#f-quem").value==="ela", cartao:"", desc,
        valorTotal: Math.round(valor*n*100)/100, avista:num(el("#f-avista").value)||0,
        parcelas:n, compInicio: compSoma(compHoje(), -(atual-1)), cat:el("#f-cat").value, data});
      torrada(DIVIDAS[el("#f-tipodiv").value]+" lançado: "+(n-atual+1)+" parcelas pela frente.");
    }else if(tipo==="cartao"){
      const cartao = el("#f-cartao").value;
      if(!cartao){ torrada("Cadastre um cartão antes."); aba="cartoes"; render(); return; }
      const n = Math.max(1, parseInt(el("#f-parcelas").value||"1",10));
      const cart = S.cartoes.find(c=>c.id===cartao);
      S.compras.push({id:id(), dela: el("#f-quem").value==="ela", cartao, desc, valorTotal:valor,
        avista:num(el("#f-avista").value)||0, parcelas:n,
        compInicio: el("#f-comp").value || primeiraComp(data, cart),
        cat: el("#f-cat").value, data});
      torrada(n+"x de "+R$(valor/n)+" lançadas.");
    }else{
      S.lancamentos.push({id:id(), tipo: tipo==="entrada"?"entrada":"gasto", dela: tipo!=="entrada" && el("#f-quem").value==="ela",
        desc, valor, cat:el("#f-cat").value, data, comp:compDe(data), fixo: el("#f-fixo").checked,
        reemb: tipo==="entrada" && el("#f-reemb").checked});
      torrada(tipo==="entrada"?"Entrada lançada.":"Gasto lançado.");
    }
    agendarSalvar();
    el("#f-desc").value=""; el("#f-valor").value=""; el("#f-avista").value=""; el("#f-parcelas").value="1";
    el("#f-atual").value="1"; el("#f-comp").value=""; el("#f-fixo").checked=false; el("#f-reemb").checked=false; el("#q-texto").value="";
    mes = compDe(data);
    aba = "painel"; render(); window.scrollTo({top:0,behavior:"smooth"});
  });
  el("#f-limpar").onclick = ()=>{
    el("#form-lanc").reset(); el("#f-data").value = iso(hoje()); el("#q-texto").value=""; renderLancar();
  };

  el("#form-cartao").addEventListener("submit", e=>{
    e.preventDefault();
    const nome = el("#ct-nome").value.trim();
    if(!nome) return;
    S.cartoes.push({id:id(), nome,
      fechamento: Math.min(31,Math.max(1,parseInt(el("#ct-fecha").value||"28",10))),
      vencimento: Math.min(31,Math.max(1,parseInt(el("#ct-vence").value||"10",10))),
      limite: num(el("#ct-limite").value)||0});
    el("#form-cartao").reset(); el("#ct-fecha").value=28; el("#ct-vence").value=10;
    agendarSalvar(); render(); torrada("Cartão cadastrado.");
  });

  el("#seg-regime").addEventListener("click", e=>{
    const b = e.target.closest("button[data-regime]"); if(!b) return;
    S.config.faturaNoVencimento = (b.dataset.regime === "venc");
    agendarSalvar(); render();
    torrada(S.config.faturaNoVencimento ? "Fatura passa a contar no vencimento." : "Fatura passa a contar no mês do lançamento.");
  });
  el("#aj-salvar-nome").onclick = ()=>{
    S.config.nomeEla = el("#aj-nome-ela").value.trim() || "Ela";
    agendarSalvar(); render(); torrada("Nome salvo.");
  };
  el("#aj-salvar-cats").onclick = ()=>{
    const a = el("#aj-cats").value.split("\n").map(s=>s.trim()).filter(Boolean);
    const b = el("#aj-cats-ent").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(a.length) S.config.cats = a;
    if(b.length) S.config.catsEnt = b;
    agendarSalvar(); render(); torrada("Categorias salvas.");
  };
  el("#aj-exemplo").onclick = async ()=>{
    if(await confirmar("Carregar exemplo","Isso substitui o que estiver lançado hoje. Serve para você ver o app funcionando.")) exemplo();
  };
  el("#aj-zerar").onclick = async ()=>{
    if(await confirmar("Apagar tudo","Todos os lançamentos, cartões e compras somem. Baixe um backup antes se tiver dúvida.")){
      const cfg = S.config; S = normaliza({config:cfg}); agendarSalvar(); render(); torrada("Tudo apagado.");
    }
  };
  el("#aj-exportar").onclick = async ()=>{
    const texto = JSON.stringify(S,null,2);
    const nome = "nosso-caixa-"+iso(hoje())+".json";
    let salvo = false;
    try{
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if(dl){ await dl.save({filename:nome, data:texto}); salvo = true; }
    }catch(_){}
    if(!salvo && !window.claude){
      try{
        const url = URL.createObjectURL(new Blob([texto],{type:"application/json"}));
        const a = document.createElement("a"); a.href = url; a.download = nome;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 4000);
        salvo = true;
      }catch(_){}
    }
    if(!salvo){
      const t = el("#aj-json"); t.classList.remove("oculto"); t.value = texto; t.select();
      torrada("Copie este texto e guarde num arquivo.");
    }else torrada("Backup salvo.");
  };
  el("#aj-importar").onclick = async ()=>{
    const t = el("#aj-json");
    if(t.classList.contains("oculto") || !t.value.trim()){
      t.classList.remove("oculto"); t.value=""; t.focus();
      torrada("Cole o backup aqui e clique de novo."); return;
    }
    try{
      const e = normaliza(JSON.parse(t.value));
      if(await confirmar("Restaurar backup","Isso substitui tudo o que está lançado agora.")){
        S = e; agendarSalvar(); render(); t.classList.add("oculto"); torrada("Backup restaurado.");
      }
    }catch(_){ torrada("Esse texto não parece um backup válido."); }
  };
  el("#an-copiar").onclick = async ()=>{
    const txt = resumoTexto();
    try{ await navigator.clipboard.writeText(txt); torrada("Resumo copiado — cole no chat com o Claude."); }
    catch(_){ const t = el("#an-resumo"); t.classList.remove("oculto"); t.value = txt; t.select(); torrada("Selecione e copie o texto."); }
  };
}

/* ===================== início ===================== */
function iniciar(){
  document.getElementById("root").appendChild(document.getElementById("shell").content.cloneNode(true));
  const embutido = lerEmbutido(), local = lerLocal();
  S = (local && (local.updatedAt||0) > (embutido.updatedAt||0)) ? local : embutido;
  if(local && (local.updatedAt||0) > (embutido.updatedAt||0)) modo = "local";
  try{
    const v = JSON.parse(sessionStorage.getItem("nc:volta")||"null");
    if(v){ aba=v.aba||aba; mes=v.mes||mes; ver=v.ver||ver; sessionStorage.removeItem("nc:volta"); }
  }catch(_){}
  ligar();
  render();
  conectar().then(carregarNuvem);
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
else iniciar();
})();
</script>
</body>
</html>
